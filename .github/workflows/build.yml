name: Build APK

on:
  workflow_dispatch:   # spustí se pouze ručně tlačítkem na GitHubu

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # assembleRelease bez local.properties/KEYSTORE_PATH dá NEPODEPSANÝ APK –
      # Android takový balíček odmítne nainstalovat ("chyba při instalaci").
      # Debug build řeší obojí: Gradle ho automaticky podepíše vestavěným
      # debug keystore (bez jakýchkoli secrets), takže jde rovnou nainstalovat.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Read version name
        id: version
        run: echo "ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkmage-${{ steps.version.outputs.ver }}-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.version.outputs.ver }}-build${{ github.run_number }}
          name: "DarkMage ${{ steps.version.outputs.ver }} (build #${{ github.run_number }})"
          body: "Debug build (nepodepsaný release keystore) z commitu ${{ github.sha }} – instalovatelný, podepsaný vestavěným debug klíčem."
          files: app/build/outputs/apk/debug/*.apk
