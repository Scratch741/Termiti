name: Build APK

on:
  workflow_dispatch:   # spustí se pouze ručně tlačítkem na GitHubu

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Bez local.properties/KEYSTORE_PATH zůstane signingConfig prázdný
      # (viz app/build.gradle.kts) → assembleRelease vyprodukuje NEPODEPSANÝ APK.
      # Pro instalaci na zařízení je potřeba ho dodatečně podepsat (apksigner)
      # nebo si lokálně vytvořit local.properties s KEYSTORE_* hodnotami.
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      # Gradle task v app/build.gradle.kts přejmenuje výstup na
      # darkmage-<versionName>-release.apk
      - name: Read version name
        id: version
        run: echo "ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkmage-${{ steps.version.outputs.ver }}-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.version.outputs.ver }}-build${{ github.run_number }}
          name: "DarkMage ${{ steps.version.outputs.ver }} (build #${{ github.run_number }})"
          body: "Release build z commitu ${{ github.sha }}"
          files: app/build/outputs/apk/release/*.apk
