name: Build APK

on:
  workflow_dispatch:   # spustí se pouze ručně tlačítkem na GitHubu

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Release APK se musí podepsat. Keystore je uložený v GitHub Secrets jako
      # base64 (RELEASE_KEYSTORE_BASE64) – zde se dekóduje a vygeneruje se
      # local.properties, ze kterého build.gradle.kts čte signing config.
      - name: Decode keystore + create local.properties
        run: |
          # Fail-fast: chybějící secrets by jinak vytvořily prázdný keystore
          # a build by spadl až u podpisu s kryptickou chybou.
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::error::Chybí GitHub Secrets pro podpis (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). Nastav je v Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Sanity check dekódovaného keystore (bez vyzrazení obsahu)
          SIZE=$(stat -c%s "$RUNNER_TEMP/release.keystore")
          echo "keystore size: $SIZE bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::Dekódovaný keystore je podezřele malý ($SIZE B) – RELEASE_KEYSTORE_BASE64 je nejspíš poškozený/neúplný."
            exit 1
          fi
          cat > local.properties <<EOF
          KEYSTORE_PATH=$RUNNER_TEMP/release.keystore
          KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # Gradle task v app/build.gradle.kts přejmenuje výstup na
      # darkmage-<versionName>-release.apk
      - name: Read version name
        id: version
        run: echo "ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkmage-${{ steps.version.outputs.ver }}-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.version.outputs.ver }}-build${{ github.run_number }}
          name: "DarkMage ${{ steps.version.outputs.ver }} (build #${{ github.run_number }})"
          body: "Release build z commitu ${{ github.sha }}"
          files: app/build/outputs/apk/release/*.apk
